name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-version.js "$GITHUB_REF_NAME"
      - run: mise run build

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/zundamonotify-macos-arm64 --title "$TAG" --generate-notes --verify-tag
