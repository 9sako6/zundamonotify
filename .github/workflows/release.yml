name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-version.js "$GITHUB_REF_NAME"
      - run: mise run build

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/zundamonotify-macos-arm64 --clobber
