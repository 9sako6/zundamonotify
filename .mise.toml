[tools]
bun = "1.3.12"
node = "24.15.0"

[tasks.serve]
run = "node bin/cli.js serve"
description = "Run zundamonotify in the foreground"

[tasks.build]
run = "node scripts/build-binary.js"
description = "Build the zundamonotify executable"

[tasks.test]
run = "node --test"
description = "Run the test suite"
