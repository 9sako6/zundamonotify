[package]
name = "zundamonotify"
version = "0.5.4"
edition = "2024"
description = "AIエージェントのお仕事完了を「ずんだもん」の音声でお知らせするCLIツールなのだ"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
